[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stOTopic"
version = "0.1.0"
description = "Optimal-transport topic modeling for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "torch>=2.0",
  "anndata>=0.9", "scanpy>=1.9", "scikit-learn>=1.2",
  "matplotlib>=3.6", "tqdm>=4.64", "scikit-misc>=0.3", "squidpy>=1.3"
]

[project.optional-dependencies]
spatial = ["squidpy>=1.3"]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
stotopic-demo = "stotopic.demo:main"

[tool.setuptools]
packages = ["stotopic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
